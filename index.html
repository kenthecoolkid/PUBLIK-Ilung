/* ========== RATING ========== */

function buatRating(rating) {
  const penuh = Math.floor(rating);
  const kosong = 5 - penuh;
  let bintang = "";
  for (let i = 0; i < penuh; i++) bintang += "★";
  for (let i = 0; i < kosong; i++) bintang += "☆";

  return `
    <div class="rating">
      <span class="bintang">${bintang}</span>
      <b>${rating}/5</b>
    </div>
  `;
}

    <div class="akses-box">
      <b>${T("akses")}</b>
      <div class="akses-item">🛣️ <b>${T("kondisi")}</b> ${l.akses.jalan}</div>
      <div class="akses-item">🏍️ <b>${T("motor")}</b> ${l.akses.motor}</div>
      <div class="akses-item">🚗 <b>${T("mobil")}</b> ${l.akses.mobil}</div>
      <div class="akses-item">⚠️ <b>${T("catatan")}</b> ${l.akses.catatan}</div>
      <div class="akses-catatan">${T("aksesCatatan")}</div>
    </div>
  `;
}


/* ========== TOMBOL LINK ========== */

function buatTombolLink(l) {
  const googleMaps =
    'https://www.google.com/maps/dir/?api=1&destination=' + l.lat + ',' + l.lng;

  const tiktok =
    l.tiktok || 'https://www.tiktok.com/search?q=' + encodeURIComponent(l.nama);

  const youtube =
    l.youtube || 'https://www.youtube.com/results?search_query=' + encodeURIComponent(l.nama);

  return `
    <div class="link-container">
      <a href="${googleMaps}" target="_blank" class="link-btn google-btn" onclick="event.stopPropagation();">📍 Google Maps</a>
      <a href="${tiktok}" target="_blank" class="link-btn tiktok-btn" onclick="event.stopPropagation();">🎵 TikTok</a>
      <a href="${youtube}" target="_blank" class="link-btn youtube-btn" onclick="event.stopPropagation();">▶️ YouTube</a>
    </div>
  `;
}


/* ========== FORMAT RUPIAH ========== */

function formatRupiah(angka) {
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    maximumFractionDigits: 0
  }).format(angka);
}


/* ========== ESTIMASI GRAB ========== */

function estimasiGrabMotor(jarakKm) {
  const harga = 9000 + (jarakKm * 3000);
  return Math.ceil(harga / 1000) * 1000;
}

function estimasiGrabMobil(jarakKm) {
  const harga = 15000 + (jarakKm * 5000);
  return Math.ceil(harga / 1000) * 1000;
}


/* ========== RUTE ========== */

let markers = [];
let routeLine = null;

function tampilkanRute(tujuanLat, tujuanLng, namaTempat, biaya, akses) {

  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }

  const infoBox = document.getElementById('infoPerjalanan');
  infoBox.style.display = 'block';
  infoBox.innerHTML = `<b>${T("menghitung")}</b>`;

  const url =
    'https://router.project-osrm.org/route/v1/driving/' +
    titikAwal.lng + ',' + titikAwal.lat + ';' +
    tujuanLng + ',' + tujuanLat +
    '?overview=full&geometries=geojson&steps=false';

  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error('Routing error');
      return res.json();
    })
    .then(data => {

      if (!data.routes || data.routes.length === 0) {
        infoBox.innerHTML = `<b>${T("ruteTidak")}</b>`;
        return;
      }

      const rute = data.routes[0];
      const koordinat = rute.geometry.coordinates.map(c => [c[1], c[0]]);

      routeLine = L.polyline(koordinat, {
        color: 'red',
        weight: 5,
        opacity: 0.75
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

      const jarakKm = rute.distance / 1000;
      const jarakTampil = jarakKm < 10 ? jarakKm.toFixed(1) : jarakKm.toFixed(0);

      const durasiDasar = Math.round(rute.duration / 60);

      const motorMin = Math.max(5, Math.round(durasiDasar * 0.85));
      const motorMax = Math.max(motorMin + 5, Math.round(durasiDasar * 1.20));
      const mobilMin = Math.max(5, Math.round(durasiDasar * 0.90));
      const mobilMax = Math.max(mobilMin + 5, Math.round(durasiDasar * 1.25));

      const grabMotor = estimasiGrabMotor(jarakKm);
      const grabMobil = estimasiGrabMobil(jarakKm);

      infoBox.innerHTML = `

        <b>${T("tujuan")}: ${namaTempat}</b>

        <div class="baris">${T("jarak")} ${jarakTampil} km</div>
        <div class="baris">${T("motorPribadi")} ± ${motorMin}-${motorMax} menit</div>
        <div class="baris">${T("mobilPribadi")} ± ${mobilMin}-${mobilMax} menit</div>

        <div class="grab-box">

          <b>${T("estimasiGrab")}</b>

          <div class="baris" style="margin-top:8px;">${T("grabMotor")}</div>
          <div class="baris">${T("harga")} sekitar ${formatRupiah(grabMotor)}</div>
          <div class="baris">${T("jarakLabel")} ${jarakTampil} km</div>
          <div class="baris">${T("waktu")} ± ${motorMin}-${motorMax} menit</div>

          <div class="grab-mobil">
            ${T("grabMobil")}
            <div class="baris">${T("harga")} sekitar ${formatRupiah(grabMobil)}</div>
            <div class="baris">${T("jarakLabel")} ${jarakTampil} km</div>
            <div class="baris">${T("waktu")} ± ${mobilMin}-${mobilMax} menit</div>
          </div>

          <div class="grab-catatan">${T("grabCatatan")}</div>

        </div>

        ${buatAkses({ akses: akses })}

        <div class="baris">${T("biaya")} ${biaya}</div>

        <div class="baris" style="font-size:11px;color:#888;margin-top:8px;">
          ${T("ruteCatatan")}
        </div>

      `;

    })
    .catch(err => {

      console.log(err);

      infoBox.innerHTML = `
        <b>${T("gagal")}</b>
        <div class="baris">${T("cobaLagi")}</div>
        ${buatAkses({ akses: akses })}
      `;

    });

}


/* ========== RENDER PETA ========== */

function renderPeta(data) {

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const list = document.getElementById('list');
  list.innerHTML = '';

  data.forEach(l => {

    const marker = L.marker([l.lat, l.lng], {
      icon: ikonKategori[l.kategori]
    }).addTo(map);

    let media = `<div class="media-container">`;

    if (l.foto) {
      media += `<img src="${l.foto}" alt="${l.nama}">`;
    }

    if (l.video) {
      media += `<iframe src="${l.video}" allowfullscreen></iframe>`;
    }

    media += `</div>`;

    const popup = `

      <b>${l.nama}</b>

      <br><br>

      ${l.desc}

      ${buatRating(l.rating)}

      <div class="jam-buka">${T("jam")} ${l.jamBuka}</div>

      ${buatAkses(l)}

      <br>

      💰 ${l.biaya}

      ${media}

      ${buatTombolLink(l)}

    `;

    marker.bindPopup(popup);
    markers.push(marker);

    marker.on('click', function () {
      tampilkanRute(l.lat, l.lng, l.nama, l.biaya, l.akses);
    });

    const div = document.createElement('div');
    div.className = 'item';

    div.innerHTML = `

      <b>${l.nama}</b>

      ${buatRating(l.rating)}

      <div class="jam-buka">${T("jam")} ${l.jamBuka}</div>

      <small>${l.desc}</small>

      ${buatAkses(l)}

      <div>💰 ${l.biaya}</div>

      ${media}

      ${buatTombolLink(l)}

    `;

    div.onclick = function () {
      map.flyTo([l.lat, l.lng], 15);
      marker.openPopup();
      tampilkanRute(l.lat, l.lng, l.nama, l.biaya, l.akses);
    };

    list.appendChild(div);

  });

}


/* ========== TAMPILKAN SEMUA ========== */

function aktifkanTombol(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function buatFilter() {

  filterDiv.innerHTML = '';

  const btnAll = document.createElement('button');
  btnAll.textContent = T("semua");
  btnAll.className = 'filter-btn active';

  btnAll.onclick = function () {
    renderPeta(lokasi);
    aktifkanTombol(btnAll);
  };

  filterDiv.appendChild(btnAll);

  kategoriUnik.forEach(kat => {

    const btn = document.createElement('button');

    btn.textContent = namaKategori[bahasaAktif][kat] || kat;
    btn.className = 'filter-btn';

    btn.onclick = function () {
      renderPeta(lokasi.filter(l => l.kategori === kat));
      aktifkanTombol(btn);
    };

    filterDiv.appendChild(btn);

  });

}

  buatFilter();

  const kata = document.getElementById('search').value.toLowerCase();

  renderPeta(lokasi.filter(l => l.nama.toLowerCase().includes(kata)));

}
